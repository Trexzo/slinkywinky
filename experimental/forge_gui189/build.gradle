buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

sourceCompatibility = targetCompatibility = '1.8'
version = '0.1.0-input-proof'
group = 'dev.slinkywinky'
archivesBaseName = 'slinkywinky-gui189-input-proof'

minecraft {
    version = '1.8.9-11.15.1.2318-1.8.9'
    mappings = 'stable_22'
    runDir = 'run'
    makeObfSourceJar = false
}
compileJava.options.encoding = 'UTF-8'

// The acceptance profile can only be enabled by an explicit process env;
// normal builds and normal Forge mod loading remain inert.
def mouseAutoProof = System.getenv('SLINKYWINKY_R215_SOURCE_MOUSE_TEST') == '1'
def mouseManualProof = System.getenv('SLINKYWINKY_R215_MANUAL_MOUSE') == '1'
def gl11Proof = System.getenv('SLINKYWINKY_R214_GL11_TEST') == '1' || mouseAutoProof || mouseManualProof
def nativeProof = System.getenv('SLINKYWINKY_R213_NATIVE_TEST') == '1' || gl11Proof
def autoProof = System.getenv('SLINKYWINKY_R212_GUI_AUTO_TEST') == '1' || (nativeProof && !mouseManualProof)
def nativeDllDir = null
def gl11DllDir = null
if (nativeProof) {
    def javaRoot = System.getenv('SLINKYWINKY_R213_PR2_JAVA_SOURCE')
    def dllRoot = System.getenv('SLINKYWINKY_R213_PR2_JNI_DIR')
    if (!javaRoot || !new File(javaRoot, 'dev/slinkywinky/SprintObservationProbe.java').isFile() ||
        !dllRoot || !new File(dllRoot, 'slinkywinky_jni.dll').isFile())
        throw new GradleException('R213 requires explicit real PR2 source and JNI, no mock fallback')
    sourceSets.main.java.srcDir(javaRoot)
    nativeDllDir = dllRoot
}
if (gl11Proof) {
    gl11DllDir = System.getenv('SLINKYWINKY_R214_GL11_JNI_DIR')
    if (!gl11DllDir || !new File(gl11DllDir, 'slinkywinky_r214_gui_overlay.dll').isFile())
        throw new GradleException('R214 requires Chat 1 native GL11 bridge DLL, not a mock')
}
def manualProof = System.getenv('SLINKYWINKY_R212_GUI_MANUAL_TEST') == '1' || mouseManualProof
if (mouseAutoProof && mouseManualProof)
    throw new GradleException('R215 requires either scripted or manual input, not both')
if (autoProof && manualProof)
    throw new GradleException('Choose only one R212 GUI proof mode')
if (autoProof || manualProof) {
    def isolated = System.getenv('SLINKYWINKY_R212_GUI_GAME_DIR')
    if (!isolated || !isolated.replace('\\','/').toLowerCase().contains('/temp/slinkywinky-r212-gui-'))
        throw new GradleException('R212 requires a uniquely named TEMP-only game directory')
    minecraft.runDir = isolated
    afterEvaluate {
        runClient {
            args '--username','R212GuiOffline'
            systemProperty 'slinkywinky.r212GuiInputProof','true'
            systemProperty 'slinkywinky.r212GuiAutoProof',autoProof.toString()
            systemProperty 'slinkywinky.r212GuiManualProof',manualProof.toString()
            systemProperty 'slinkywinky.r213NativeSprintBridge',nativeProof.toString()
            systemProperty 'slinkywinky.r214NativeGuiOverlay',gl11Proof.toString()
            systemProperty 'slinkywinky.r215SourceMouseAuto',mouseAutoProof.toString()
            systemProperty 'slinkywinky.r215SourceMouseManual',mouseManualProof.toString()
            if (nativeProof) systemProperty 'java.library.path',
                nativeDllDir + (gl11Proof ? File.pathSeparator + gl11DllDir : '')
            systemProperty 'java.awt.headless','false'
        }
    }
}
