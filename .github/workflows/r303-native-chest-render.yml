name: R303 native chest draw-plan integration
on:
  push:
    paths:
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeChestEspDebugRenderer.java'
      - 'tools/run_r207_independent_forge_loader.ps1'
      - '.github/workflows/r303-native-chest-render.yml'
  pull_request:
    paths:
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeChestEspDebugRenderer.java'
      - 'tools/run_r207_independent_forge_loader.ps1'
      - '.github/workflows/r303-native-chest-render.yml'

jobs:
  real-jni-source-chest-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Configure actual C++ JNI library
        run: cmake -S . -B build/r303 -DSLINKYWINKY_BUILD_JNI=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build actual JNI library
        run: cmake --build build/r303 --target slinkywinky_jni --parallel 2
      - name: Test R301/303 Java8 to actual native source plan
        run: ctest --test-dir build/r303 -R '^r301_java8_real_native_three_esp_controllers$' --output-on-failure
  powershell51-and-source-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse isolated launcher and verify R303 artifacts
        shell: powershell
        run: |
          $t=$null;$errors=$null
          $file=Join-Path $env:GITHUB_WORKSPACE 'tools/run_r207_independent_forge_loader.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $file,[ref]$t,[ref]$errors)
          if($errors.Count -gt 0){
            foreach($x in $errors){Write-Error $x.ToString()}
            throw 'R303 launcher PowerShell 5.1 parse failure'
          }
          $l=Get-Content $file -Raw
          $src=Get-Content 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java' -Raw
          $jni=Get-Content 'reference_compat/src/esp_world_snapshot_jni.cpp' -Raw
          foreach($x in @(
            'R303ChestRenderTest','R303ExpectedJarSha256',
            'slinkywinky.r303ChestRenderProbe=true',
            'R303_CHEST_RENDER_TEST='
          )){if(-not $l.Contains($x)){throw ('Missing R303 launcher gate '+$x)}}
          foreach($x in @(
            'RenderWorldLastEvent','R303_CHEST_LIVE_DRAW_SUBMITTED',
            'r303World','r303LastReceipt'
          )){if(-not $src.Contains($x)){throw ('Missing R303 render gate '+$x)}}
          if(-not $jni.Contains('EspNativeReadOnlyPreview_nativeChestPlan')){
            throw 'Missing actual JNI draw-plan bridge'
          }
          Write-Output 'R303_LAUNCHER_AND_RENDER_PLAN_CONTRACT_PASS'
