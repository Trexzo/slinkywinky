name: Windows JNI preview artifact

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-jni-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java 8 JNI headers and runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      # R292: native Windows PS5.1 ParseFile has no launcher side effects.
      - name: R292 parse SHA-pinned Windows R289 isolated-world launcher
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'tools/run_r207_independent_forge_loader.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$parseErrors)
          if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
            foreach ($issue in $parseErrors) { Write-Error $issue.ToString() }
            throw 'R292 original Windows PS5.1 launcher has syntax errors'
          }
          $body = Get-Content -LiteralPath $path -Raw
          foreach ($required in @(
            'R289RosterWorldTest',
            '37ed0d9ec4319ae7ffeefce19787394d6de1d75214c27f063b85c461ea62a807',
            'slinkywinky.r289RosterLocalWorldTest=true',
            'slinkywinky.r278RosterReadOnlyProbe=true',
            'slinkywinky.r283NativeRosterReadOnlyProbe=true',
            'R289_ROSTER_WORLD_TEST',
            'NATIVE_JNI_SHA256',
            'R278Offline'
          )) {
            if (-not $body.Contains($required)) {
              throw ('R292 isolated launcher missing contract: ' + $required)
            }
          }
          Write-Output 'R292_WINDOWS_PS51_R289_PINNED_LAUNCHER_PARSE_PASS'
      - name: R294 parse process-identity-checked in-world receipt verifier
        shell: powershell
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'tools/verify_r294_roster_windows.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            foreach ($issue in $errors) { Write-Host $issue.ToString() }
            throw 'R294 verifier failed PowerShell 5.1 parsing'
          }
          $content = Get-Content -LiteralPath $path -Raw
          foreach ($required in @(
            'TestProcessId', 'Get-CimInstance Win32_Process',
            'R278Offline', 'r289RosterLocalWorldTest=true',
            'R291_REAL_FORGE_ROSTER_RECEIPT_PROVENANCE_PASS',
            'R294_EXACT_TEST_JVM_REAL_ROSTER_JNI_PASS',
            'CreationDate', 'slinkywinky_jni.dll'
          )) {
            if (-not $content.Contains($required)) {
              throw ('R294 verifier missing proof check ' + $required)
            }
          }
          Write-Output 'R294_WINDOWS_PS51_LIVE_JVM_VERIFIER_PARSE_PASS'
      - name: Configure native library
        run: cmake -S . -B build-jni -A x64 -DSLINKYWINKY_BUILD_JNI=ON
      - name: Build Windows native bridge
        run: cmake --build build-jni --config Release --parallel
      - name: Test Java 8 to Windows native roundtrip
        run: ctest --test-dir build-jni -C Release --output-on-failure
      - name: Publish verified preview DLL
        uses: actions/upload-artifact@v4
        with:
          name: slinkywinky-jni-windows-x64-preview
          path: build-jni/Release/slinkywinky_jni.dll
          if-no-files-found: error
          retention-days: 7
