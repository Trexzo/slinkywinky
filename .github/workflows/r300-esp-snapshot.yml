name: R300 ESP owner-thread Java 8 snapshots
on:
  push:
    paths:
      - 'java/dev/slinkywinky/EspWorldSnapshotSampler.java'
      - 'tests/java/dev/slinkywinky/attach/R300EspWorldSnapshotSmoke.java'
      - '.github/workflows/r300-esp-snapshot.yml'
  pull_request:
    paths:
      - 'java/dev/slinkywinky/EspWorldSnapshotSampler.java'
      - 'tests/java/dev/slinkywinky/attach/R300EspWorldSnapshotSmoke.java'
      - '.github/workflows/r300-esp-snapshot.yml'
jobs:
  java8-esp-owner-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compile exact Java 8 smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/r300
          javac -source 8 -target 8 -d build/r300 \
            java/dev/slinkywinky/EspWorldSnapshotSampler.java \
            tests/java/dev/slinkywinky/attach/R300EspWorldSnapshotSmoke.java
      - name: Owner/epoch/negative controls
        run: java -cp build/r300 dev.slinkywinky.attach.R300EspWorldSnapshotSmoke
