      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'java/dev/slinkywinky/SourceRuntimePreview.java'
      - 'java/dev/slinkywinky/SourceWorldReadOnlyHost.java'
      - 'java/dev/slinkywinky/SourceAttackEventFence.java'
