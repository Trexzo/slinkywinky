      - 'java/dev/slinkywinky/ClutchFaceReceiptStatus.java'
      - 'java/dev/slinkywinky/ClutchNativePreview.java'
      - '.github/workflows/forge189.yml'

jobs:
  forge-java8:
    name: ForgeGradle 2.1 / Minecraft 1.8.9 / JDK 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: JDK 8 for legacy ForgeGradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Gradle 2.14.1 (legacy toolchain)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '2.14.1'
          cache-disabled: true
      - name: Build experimental Forge 1.8.9 JAR
        run: gradle --no-daemon -p experimental/forge189 build --stacktrace
      - name: Verify seven real Netty EmbeddedChannel pass-through tests
        shell: bash
        run: |
          set -euo pipefail
          xml=experimental/forge189/build/test-results/TEST-dev.slinkywinky.forge.ForgeSourcePacketTapEmbeddedTest.xml
          test -f "$xml"
          test "$(grep -c '<testcase' "$xml")" -eq 7
          if grep -Eq '<failure|<error' "$xml"; then
            echo "R340 Netty identity and overflow tests failed" >&2; exit 1
          fi
          echo R352_S19_SOURCE_IDENTITY_AND_R340_PACKET_PASS_THROUGH_PASS
      - name: R344 real Netty packet retention and release owner tests
        shell: bash
        run: |
          set -euo pipefail
          xml=experimental/forge189/build/test-results/TEST-dev.slinkywinky.forge.ForgePacketHoldOwnerTest.xml
          test -f "$xml"
          test "$(grep -c '<testcase' "$xml")" -eq 8
          if grep -Eq '<failure|<error' "$xml"; then
            echo 'R344 Netty packet lifetime ownership tests failed' >&2
            exit 1
          fi
          echo R344_ACTUAL_PACKET_HOLD_FIFO_EXPIRE_OVERFLOW_DISCONNECT_PASS
      - name: R345 outbound Packet plus original ChannelPromise owner tests
        shell: bash
        run: |
          set -euo pipefail
          xml=experimental/forge189/build/test-results/TEST-dev.slinkywinky.forge.ForgeOutboundPacketHoldOwnerTest.xml
          test -f "$xml"
          test "$(grep -c '<testcase' "$xml")" -eq 8
          if grep -Eq '<failure|<error' "$xml"; then
            echo 'R345 outbound Packet+Promise owner tests failed' >&2
            exit 1
          fi
          echo R345_OUTBOUND_EXACT_PACKET_PROMISE_REPLAY_PASS
      - name: Check packaged classes
        shell: bash
        run: |
          set -euo pipefail
          jarpath=$(find experimental/forge189/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$jarpath"
          jar tf "$jarpath" > forge-preview-contents.txt
          for class in \
            dev/slinkywinky/forge/ForgePreview.class \
            dev/slinkywinky/forge/ForgeChestEspDebugRenderer.class \
            dev/slinkywinky/forge/ForgeEntityEspDebugRenderer.class \
            dev/slinkywinky/forge/ForgePlayerEspScreenRenderer.class \
            dev/slinkywinky/PlayerEspScreenProjection.class \
            dev/slinkywinky/forge/ForgeRelationshipRosterPort.class \
            dev/slinkywinky/forge/ForgeEspWorldSnapshotPort.class \
            dev/slinkywinky/RelationshipRosterSampler.class \
            dev/slinkywinky/EspWorldSnapshotSampler.class \
            dev/slinkywinky/EspNativeReadOnlyPreview.class \
            dev/slinkywinky/RelationshipRosterNativePreview.class \
            dev/slinkywinky/RosterIsolationGate.class \
            dev/slinkywinky/SourceRuntimePreview.class \
            dev/slinkywinky/SourceWorldReadOnlyHost.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$AttackPort.class \
            dev/slinkywinky/SourceAttackEventFence.class \
            dev/slinkywinky/SourceCandidateField189.class \
             dev/slinkywinky/SourceBacktrackReachEvidence.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$RenderPort.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$RenderFrame.class \
            dev/slinkywinky/forge/ForgeSourceWorldPort.class \
            dev/slinkywinky/SourcePacketReadOnlyQueue.class \
            dev/slinkywinky/SourcePacketReadOnlyQueue\$Observation.class \
            dev/slinkywinky/SourcePacketReadOnlyQueue\$Batch.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$PacketReceipt.class \
            dev/slinkywinky/forge/ForgeSourcePacketTap.class \
            dev/slinkywinky/forge/ForgeSourceBoxDiagnosticRenderer.class \
            dev/slinkywinky/SourceRuntimePreview\$SourceBox.class \
            dev/slinkywinky/SourceRuntimePreview\$SourceBoxes.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$BoxPort.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$BoxFrame.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$HistoryPort.class \
            dev/slinkywinky/SourceWorldReadOnlyHost\$RemoteTarget.class \
            dev/slinkywinky/SourceRemotePositionHistory.class \
            dev/slinkywinky/SourceRemotePositionHistory\$Position.class \
            dev/slinkywinky/SourceRemotePositionHistory\$Historical.class \
            dev/slinkywinky/SourcePacketControlMailbox.class \
            dev/slinkywinky/SourcePacketControlMailbox\$Ticket.class \
            dev/slinkywinky/SourcePacketVerdictBridge.class \
            dev/slinkywinky/SourcePacketVerdictBridge\$Decision.class; do
            if ! grep -Fxq "$class" forge-preview-contents.txt; then
              echo "Required read-only Forge class missing: $class" >&2
              exit 1
            fi
          done
          # The actual packet-owning implementation is confined to
          # the test source set until source timing and runtime gates exist.
          if grep -Eq 'ForgeOutboundPacketHoldOwner(\\$|\\.)|ForgeOutboundPacketHoldOwnerTest\\.class' forge-preview-contents.txt; then
            echo 'R345 outbound packet-owning implementation must never ship in Forge JAR' >&2
            exit 1
          fi
          if grep -Eq 'ForgePacketHoldOwner(\\$|\\.)|ForgePacketHoldOwnerTest\\.class' forge-preview-contents.txt; then
            echo 'R344 experimental packet owner must NOT ship inside the Forge JAR' >&2
            exit 1
          fi
          if grep -Fq 'ForgeSourcePacketTapEmbeddedTest.class' forge-preview-contents.txt; then
            echo 'R340 test class leaked into production Forge jar' >&2; exit 1
          fi
          if grep -Eq 'dev/slinkywinky/(NativeSmoke|HostSmoke)\.class' forge-preview-contents.txt; then
            echo 'Smoke-test mains should not be in the Forge mod JAR' >&2; exit 1
          fi
          sha256sum "$jarpath" > forge-preview.sha256
      - name: Verify R337/R338 source observer remains read-only
        shell: bash
        run: |
          set -euo pipefail
          forge=experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java
          source=experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceWorldPort.java
          host=java/dev/slinkywinky/SourceWorldReadOnlyHost.java
          grep -Fq 'r337NativeSourceTickReadOnly' "$forge"
          grep -Fq 'R337_REAL_FORGE_SOURCE_TICK_OBSERVED' "$forge"
          grep -Fq 'R338_REAL_FORGE_TIMER_SOURCE_FRAME_OBSERVED' "$forge"
          grep -Fq 'Math.min(0.25d,delta)' "$forge"
          grep -Fq 'sourceReachEligible' docs/R337_REAL_FORGE_WORLD_SOURCE_OBSERVATION.md
          grep -Fq 'public final class ForgeSourceWorldPort' "$source"
          grep -Fq '0.1d,0d' "$source"
           grep -Fq 'r349BacktrackExactReachReadOnly' "$source"
           grep -Fq 'otherPlayerMPX' "$source"
           grep -Fq 'SourceBacktrackReachEvidence.currentIsCloserThanShown' "$source"
          grep -Fq 'nativePreview.observe(' "$host"
          if grep -Eq 'write(Key|Timer)|sendPacket|addToSendQueue|glBegin' "$source"; then
            echo 'Unexpected gameplay write in read-only source sampler' >&2; exit 1
          fi
          packet=experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourcePacketTap.java
          queue=java/dev/slinkywinky/SourcePacketReadOnlyQueue.java
          grep -Fq 'r339PacketReadOnly' "$forge"
          grep -Fq 'R339_REAL_NETTY_READONLY_JNI_PACKET_OBSERVED' "$forge"
          grep -Fq 'ctx.fireChannelRead(msg);' "$packet"
          grep -Fq 'ctx.write(msg,promise);' "$packet"
          grep -Fq 'pipeline.addBefore("packet_handler",handlerName,observer)' "$packet"
          grep -Fq 'queue.size()==CAPACITY' "$queue"
          grep -Fq 'SourcePacketReadOnlyQueue.Observation' "$host"
          if grep -Eq 'sendPacket\(|release\(|ReferenceCountUtil\.release|ctx\.close\(|promise\.setFailure' "$packet"; then
            echo 'R339 Netty source tap may mutate real traffic' >&2; exit 1
          fi
          # R341: source event6 uses real JNI geometry; GL only inside opt-in diagnostic.
          gl=experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceBoxDiagnosticRenderer.java
          grep -Fq 'r341SourceBoxDiagnostic' "$forge"
          grep -Fq 'R341_REAL_JNI_SOURCE_EVENT6_GL_SUBMITTED' "$forge"
          grep -Fq 'glPushAttrib(GL11.GL_ALL_ATTRIB_BITS)' "$gl"
          grep -Fq 'glPopAttrib()' "$gl"
          grep -Fq 'SourceRuntimePreview.SourceBoxes' "$host"
          grep -Fq 'r342ServerHistoryDiagnostic' "$forge"
          grep -Fq 'R342_AUTHENTIC_APPLIED_SERVERPOS_HISTORY_SUBMITTED' "$forge"
          grep -Fq 'captureHistoricalBoxes(' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceWorldPort.java
          grep -Fq 'SourceRemotePositionHistory.MIN_AGE_NANOS' "$gl"
          grep -Fq 'SourceRemotePositionHistory.Historical' "$host"
          grep -Fq 'captureRemoteTargets()' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceWorldPort.java
          grep -Fq 'world.playerEntities' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceWorldPort.java
          grep -Fq 'distance>576.0d' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeSourceWorldPort.java
          grep -Fq 'sourceHistory' "$host" || grep -Fq 'positionHistory.applied' "$host"
          mailbox=java/dev/slinkywinky/SourcePacketControlMailbox.java
          grep -Fq 'AtomicReference<Ticket>' "$mailbox"
          grep -Fq 'MAX_TICKET_AGE_NANOS=100_000_000L' "$mailbox"
          grep -Fq 'R346' "$mailbox"
          if grep -Eq 'sendPacket\(|ctx\.write\(|ctx\.fireChannelRead\(|nativeOpen\(' "$mailbox"; then
            echo 'R346 mailbox must never control packets or call JNI on Netty' >&2
            exit 1
          fi
          verdicts=java/dev/slinkywinky/SourcePacketVerdictBridge.java
          grep -Fq 'BACKTRACK_PACKET' "$verdicts"
          grep -Fq 'LAG_RANGE_PACKET' "$verdicts"
          grep -Fq 'MAX_DECISION_AGE_NANOS=100_000_000L' "$verdicts"
          grep -Fq 'CAPACITY=64' "$verdicts"
          if grep -Eq 'sendPacket\(|ctx\.write\(|ctx\.fireChannelRead\(' "$verdicts"; then
            echo 'R347 JNI verdict transport may NOT replay network packets' >&2
            exit 1
          fi
          grep -Fq 'r348NativePacketVerdictTelemetryReadOnly' "$forge"
          grep -Fq 'R348_REAL_NATIVE_PACKET_VERDICT_TELEMETRY' "$forge"
          grep -Fq 'backtrackHold' "$host"
          grep -Fq 'backtrackFeedback' "$host"
          grep -Fq 'lagRangeHold' "$host"
          grep -Fq 'timerHold' "$host"
          grep -Fq 'packetsAlreadyForwarded=1 gameWrites=0' "$forge"
          echo R348_REAL_NATIVE_PACKET_PROPOSALS_ONLY_PACKAGING_PASS
          echo R347_REAL_JNI_PACKET_VERDICT_FIFO_PASSIVE_PACKAGING_PASS
          echo R346_PASSIVE_JNI_NETTY_TICKET_PACKAGING_PASS
          echo R343_BOUNDED_NEARBY_PLAYER_HISTORY_PACKAGING_PASS
          echo R342_EXACT_SERVERPOS_HISTORY_PACKAGING_PASS
          echo R341_FORGE_SOURCE_BOX_OPTIN_RENDER_PACKAGING_PASS
          echo R339_FORGE_PACKET_PASSIVE_TAP_PACKAGING_PASS
          echo R338_FORGE_SOURCE_READONLY_PACKAGING_PASS
      - name: Upload experimental Forge JAR
        uses: actions/upload-artifact@v4
        with:
          name: slinkywinky-forge189-preview-jar
          path: |
            experimental/forge189/build/libs/*.jar
            forge-preview.sha256
          if-no-files-found: error
          retention-days: 7
