name: R308 source Player ESP style native provenance

on:
  push:
    paths:
      - 'reference_compat/include/slinkywinky/player_esp_controller.hpp'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'java/dev/slinkywinky/PlayerEspScreenProjection.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePlayerEspScreenRenderer.java'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'tests/run_r301_esp_native_jni.cmake'
      - '.github/workflows/r308-native-player-style.yml'
  pull_request:
    paths:
      - 'reference_compat/include/slinkywinky/player_esp_controller.hpp'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'java/dev/slinkywinky/PlayerEspScreenProjection.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePlayerEspScreenRenderer.java'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'tests/run_r301_esp_native_jni.cmake'
      - '.github/workflows/r308-native-player-style.yml'

jobs:
  real-java8-jni-player-style-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build the actual first-party ESP source controller JNI bridge
        run: |
          cmake -S . -B build/r308 -DSLINKYWINKY_BUILD_JNI=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/r308 --target slinkywinky_jni --parallel 2
      - name: Assert R308 source selection and JNI color/owner/setting gates
        run: ctest --test-dir build/r308 -R '^r301_java8_real_native_three_esp_controllers$' --output-on-failure

  verified-source-style-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prevent styles without explicit source provenance
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nativeStageScreenStyle' reference_compat/src/esp_world_snapshot_jni.cpp
          grep -Fq 's.source_phase!=7' reference_compat/src/esp_world_snapshot_jni.cpp
          grep -Fq 'row.source_rgb_known' reference_compat/src/esp_world_snapshot_jni.cpp
          grep -Fq 'staged_style=false' reference_compat/src/esp_world_snapshot_jni.cpp
          grep -Fq 'p.relationship_flags&5u' reference_compat/include/slinkywinky/player_esp_controller.hpp
          grep -Fq 'sourceDrawBox(' java/dev/slinkywinky/PlayerEspScreenProjection.java
          grep -Fq 'sourceDrawColor(' java/dev/slinkywinky/PlayerEspScreenProjection.java
          grep -Fq 'drawStyled(' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePlayerEspScreenRenderer.java
          grep -Fq 'R308_REAL_NATIVE_PLAYER_SOURCE_STYLE_FILTER_SORT_COLOR_PASS' tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java
          # The existing R307 Forge integration must remain diagnostic until
          # relationship/target color provenance can be resolved in the game.
          if grep -Eq 'ForgePlayerEspScreenRenderer\.drawStyled\(' experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java; then
            echo 'FAIL: R308 requires real style source provenance before Forge enablement' >&2
            exit 1
          fi
          echo R308_EXPLICIT_STYLE_PROVENANCE_CONTRACT_PASS
