name: R237 Clutch world sampler Java 8
on:
  push:
    paths:
      - 'java/dev/slinkywinky/ClutchWorldSampler.java'
      - 'java/dev/slinkywinky/ClutchFaceSampler.java'
      - 'java/dev/slinkywinky/ClutchCadenceObserver.java'
      - 'java/dev/slinkywinky/ClutchFaceReceiptStatus.java'
      - 'java/dev/slinkywinky/ClutchRayReceiptStatus.java'
      - 'tests/java/dev/slinkywinky/ClutchRayReceiptStatusSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchWorldSamplerSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchFaceSamplerSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchCadenceObserverSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchFaceReceiptStatusSmoke.java'
      - 'reference_compat/include/slinkywinky/clutch_candidate_table.hpp'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeClutchWorldPort.java'
      - 'docs/R237_CLUTCH_REAL_WORLD_OBSERVATION.md'
      - '.github/workflows/r237-clutch-world-sampler.yml'
  pull_request:
    paths:
      - 'java/dev/slinkywinky/ClutchWorldSampler.java'
      - 'java/dev/slinkywinky/ClutchFaceSampler.java'
      - 'java/dev/slinkywinky/ClutchCadenceObserver.java'
      - 'java/dev/slinkywinky/ClutchFaceReceiptStatus.java'
      - 'java/dev/slinkywinky/ClutchRayReceiptStatus.java'
      - 'tests/java/dev/slinkywinky/ClutchRayReceiptStatusSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchWorldSamplerSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchFaceSamplerSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchCadenceObserverSmoke.java'
      - 'tests/java/dev/slinkywinky/ClutchFaceReceiptStatusSmoke.java'
      - 'reference_compat/include/slinkywinky/clutch_candidate_table.hpp'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeClutchWorldPort.java'
      - 'docs/R237_CLUTCH_REAL_WORLD_OBSERVATION.md'
      - '.github/workflows/r237-clutch-world-sampler.yml'
jobs:
  java8-source-observation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact C++ candidate table equals Java 8 sampler
        shell: python
        run: |
          import re
          from pathlib import Path
          cpp=Path('reference_compat/include/slinkywinky/clutch_candidate_table.hpp').read_text().split('kClutchSourceOffsets{{')[1].split('}};')[0]
          java=Path('java/dev/slinkywinky/ClutchWorldSampler.java').read_text().split('private static final int[] PACKED = {')[1].split('};')[0]
          c=[int(x,16) for x in re.findall(r'0x([0-9a-f]+)u',cpp)]
          j=[int(x,16) for x in re.findall(r'0x([0-9a-f]+)',java)]
          assert len(c)==len(j)==167 and c==j, 'candidate source/Java drift'
          print('R237_SOURCE_ORDER_167_MATCH')
      - name: Compile pure Java 8 sampler and run negative controls
        run: |
          mkdir -p build/r237
          java -version
          javac -version
          # --release 8 restricts the API and bytecode target to Java 8.
          javac --release 8 -d build/r237 \
            java/dev/slinkywinky/ClutchWorldSampler.java \
            java/dev/slinkywinky/ClutchFaceSampler.java \
            java/dev/slinkywinky/ClutchCadenceObserver.java \
            java/dev/slinkywinky/ClutchFaceReceiptStatus.java \
            java/dev/slinkywinky/ClutchRayReceiptStatus.java \
            tests/java/dev/slinkywinky/ClutchWorldSamplerSmoke.java \
            tests/java/dev/slinkywinky/ClutchFaceSamplerSmoke.java \
            tests/java/dev/slinkywinky/ClutchCadenceObserverSmoke.java \
            tests/java/dev/slinkywinky/ClutchFaceReceiptStatusSmoke.java \
            tests/java/dev/slinkywinky/ClutchRayReceiptStatusSmoke.java
          java -cp build/r237 dev.slinkywinky.ClutchWorldSamplerSmoke
          java -cp build/r237 dev.slinkywinky.ClutchFaceSamplerSmoke
          java -cp build/r237 dev.slinkywinky.ClutchCadenceObserverSmoke
          java -cp build/r237 dev.slinkywinky.ClutchFaceReceiptStatusSmoke
          java -cp build/r237 dev.slinkywinky.ClutchRayReceiptStatusSmoke
