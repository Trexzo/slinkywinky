name: Offline C++ core
on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }}
      - name: Build
        run: cmake --build build --config ${{ matrix.build }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build }} --output-on-failure
      - name: Demo smoke test
        shell: bash
        run: |
          if [[ '${{ runner.os }}' == 'Windows' ]]; then
            ./build/${{ matrix.build }}/slinkywinky_offline_demo.exe > trace.csv
          else
            ./build/slinkywinky_offline_demo > trace.csv
          fi
          test $(wc -l < trace.csv) -eq 31

  jni-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure JNI
        run: cmake -S . -B build-jni -DCMAKE_BUILD_TYPE=Release -DSLINKYWINKY_BUILD_JNI=ON
      - name: Build JNI
        run: cmake --build build-jni --parallel
      - name: JNI smoke test
        run: ctest --test-dir build-jni --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
          -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Sanitized tests
        run: ctest --test-dir build-sanitize --output-on-failure
