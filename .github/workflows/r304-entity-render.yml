name: R304 native Item & Player ESP owner-bound render data
on:
  push:
    paths:
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeEntityEspDebugRenderer.java'
      - 'tools/run_r207_independent_forge_loader.ps1'
      - '.github/workflows/r304-entity-render.yml'
  pull_request:
    paths:
      - 'java/dev/slinkywinky/EspNativeReadOnlyPreview.java'
      - 'reference_compat/src/esp_world_snapshot_jni.cpp'
      - 'tests/java/dev/slinkywinky/EspNativeReadOnlyPreviewSmoke.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java'
      - 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeEntityEspDebugRenderer.java'
      - 'tools/run_r207_independent_forge_loader.ps1'
      - '.github/workflows/r304-entity-render.yml'
jobs:
  real-native-item-player-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Configure first-party C++ JNI tests
        run: cmake -S . -B build/r304 -DSLINKYWINKY_BUILD_JNI=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build the native JNI controller integration
        run: cmake --build build/r304 --target slinkywinky_jni --parallel 2
      - name: R304 real JNI row/count/health/sort/provenance regression
        run: ctest --test-dir build/r304 -R '^r301_java8_real_native_three_esp_controllers$' --output-on-failure
  windows-powershell51-isolation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: R304 launcher and render callback contract
        shell: powershell
        run: |
          $tokens=$null;$errors=$null
          $launcher='tools/run_r207_independent_forge_loader.ps1'
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE $launcher),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0) {
            foreach($e in $errors){Write-Error $e.ToString()}
            throw 'R304 PowerShell 5.1 syntax invalid'
          }
          $ps=Get-Content $launcher -Raw
          $forge=Get-Content 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgePreview.java' -Raw
          $jni=Get-Content 'reference_compat/src/esp_world_snapshot_jni.cpp' -Raw
          $view=Get-Content 'experimental/forge189/src/main/java/dev/slinkywinky/forge/ForgeEntityEspDebugRenderer.java' -Raw
          foreach($needle in @(
            'R304EntityRenderTest','R304ExpectedJarSha256',
            'R304_ENTITY_RENDER_TEST=','slinkywinky.r304EntityRenderProbe=true',
            'slinkywinky.r304EntityLocalWorldTest=true'
          )){
            if(-not $ps.Contains($needle)){throw ('R304 launcher missing '+$needle)}
          }
          foreach($needle in @(
            'R304_ENTITY_RENDER_CALLBACK_PASS',
            'R304_ITEM_NATIVE_RENDER_SUBMITTED',
            'R304_PLAYER_NATIVE_RENDER_SUBMITTED',
            'R304_ENTITY_WORLD_ISOLATION_GATE_PASS'
          )){
            if(-not $forge.Contains($needle)){throw ('R304 world gate missing '+$needle)}
          }
          if(-not $jni.Contains('EspNativeReadOnlyPreview_nativeEntityPlan') -or
             -not $view.Contains('glPushAttrib(GL11.GL_ALL_ATTRIB_BITS)')){
            throw 'R304 native entity plan or GL restore missing'
          }
          Write-Output 'R304_NATIVE_ENTITY_RENDER_SOURCE_CONTRACT_PASS'
